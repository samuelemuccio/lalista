<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="vinylBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141216"/>
      <stop offset="60%" stop-color="#1d1b20"/>
      <stop offset="85%" stop-color="#141216"/>
      <stop offset="100%" stop-color="#09080a"/>
    </radialGradient>
    <radialGradient id="labelGrad" cx="46%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#d06c4c"/>
      <stop offset="60%" stop-color="#a94f32"/>
      <stop offset="100%" stop-color="#7a301a"/>
    </radialGradient>
    <radialGradient id="spindleGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#dcd4c8"/>
      <stop offset="100%" stop-color="#4a443d"/>
    </radialGradient>
  </defs>

  <!-- Vinyl Outer Disc -->
  <circle cx="32" cy="32" r="31" fill="url(#vinylBody)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Acoustic Micro-Grooves (Concentric Sheen Rings) -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.11)" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>

  <!-- Specular Anisotropic Light Glare -->
  <path d="M32 32 L56 12 A31 31 0 0 1 61 24 Z" fill="rgba(255,255,255,0.10)"/>
  <path d="M32 32 L8 52 A31 31 0 0 1 3 40 Z" fill="rgba(255,255,255,0.10)"/>

  <!-- Dead Wax Run-Out Groove -->
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="rgba(0,0,0,0.7)" stroke-width="1.5"/>

  <!-- Terracotta Center Label -->
  <circle cx="32" cy="32" r="14" fill="url(#labelGrad)" stroke="rgba(0,0,0,0.5)" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="rgba(255,245,230,0.38)" stroke-width="0.7" stroke-dasharray="2 1"/>

  <!-- Center Spindle Bushing -->
  <circle cx="32" cy="32" r="3.8" fill="url(#spindleGrad)" stroke="rgba(0,0,0,0.8)" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="1.8" fill="#1a1714"/>
</svg>
